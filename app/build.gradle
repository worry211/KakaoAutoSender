plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.kakaoautosender'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.kakaoautosender'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.9.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // Legacy retained activities use the old registerReceiver overload only below API 33.
        disable 'UnspecifiedRegisterReceiverFlag'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
