plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.kakaoautosender'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.kakaoautosender'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.8.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // V2/V3 use the legacy registerReceiver overload only on API < 33;
        // API 33+ explicitly uses RECEIVER_NOT_EXPORTED.
        disable 'UnspecifiedRegisterReceiverFlag'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
