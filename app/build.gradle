plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.kakaoautosender'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.kakaoautosender'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
