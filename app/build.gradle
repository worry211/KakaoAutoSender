plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.kakaoautosender'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.kakaoautosender'
        minSdk 26
        targetSdk 35
        versionCode 25
        versionName '2.1.4'
        def apiUrl = System.getenv('ANDROID_API_BASE_URL') ?: 'https://license.invalid'
        if (!(apiUrl ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?/)) {
            throw new GradleException('ANDROID_API_BASE_URL must be an HTTPS origin without a trailing slash')
        }
        buildConfigField 'String', 'API_BASE_URL', '"' + apiUrl + '"'
        // Public fingerprint of the stable commercial signing certificate. This is not a secret.
        buildConfigField 'String', 'EXPECTED_RELEASE_CERT_SHA256', '"7fbfc166fa8a8cc397e17d13ca912f52c37776f3a5f6267261c626ced88ef2d5"'
    }

    buildFeatures {
        buildConfig true
    }
    testOptions { unitTests.includeAndroidResources = true }

    signingConfigs {
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.trim().isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                // The stable commercial keystore uses the same password for the
                // keystore and its private key entry. Keep CI aligned with that
                // fixed signing asset instead of maintaining a second password.
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('validateReleaseConfiguration') {
    doLast {
        ['ANDROID_API_BASE_URL', 'ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD',
         'ANDROID_KEY_ALIAS'].each { name ->
            if (!System.getenv(name)?.trim()) throw new GradleException('Missing release variable: ' + name)
        }
        if (System.getenv('ANDROID_API_BASE_URL').contains('.invalid')) throw new GradleException('Configure the production API origin')
        if (!file(System.getenv('ANDROID_KEYSTORE_PATH')).exists()) throw new GradleException('Release keystore does not exist')
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') task.dependsOn 'validateReleaseConfiguration'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
