plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.kakaoautosender'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.kakaoautosender'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.2.0'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('KAS_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.trim().isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv('KAS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KAS_KEY_ALIAS')
                keyPassword System.getenv('KAS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
