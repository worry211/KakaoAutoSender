plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.kakaovoiceroom'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.kakaovoiceroom'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.3.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
