name: Discord seller v6 editor

on:
  push:
    branches:
      - feat/discord-seller-console-v6
    paths:
      - .github/workflows/discord-seller-v6-editor.yml

permissions:
  contents: write

jobs:
  edit-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discord-seller-console-v6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply v6 seller console patch
        run: python scripts/patch_discord_seller_v6.py
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Format patched seller console
        working-directory: backend
        run: npx prettier --write src/discordV2.ts src/sellerConsoleModals.ts test/seller-ops-v6.test.ts
      - name: Verify backend
        working-directory: backend
        run: npm run typecheck && npm run lint && npm test && npm audit --audit-level=moderate
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/discordV2.ts backend/src/sellerConsoleModals.ts backend/test/seller-ops-v6.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "feat(discord): add action-first system operations console"
          git push origin HEAD:feat/discord-seller-console-v6
