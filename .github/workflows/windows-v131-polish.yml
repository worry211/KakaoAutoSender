name: Windows v1.3.1 usability polish

on:
  push:
    branches:
      - feat/windows-client-v1
    paths:
      - scripts/apply_windows_v131_polish.py
      - .github/workflows/windows-v131-polish.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-client-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.3.1 polish
        run: python scripts/apply_windows_v131_polish.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj
      - name: Build release
        run: dotnet build desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release --no-restore -warnaserror
      - name: Publish self-contained x64
        run: dotnet publish desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o desktop/publish/v1.3.1
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/KakaoMacro.Windows/App.xaml \
                  desktop/KakaoMacro.Windows/MainWindow.xaml \
                  desktop/KakaoMacro.Windows/MainWindow.xaml.cs \
                  desktop/KakaoMacro.Windows/Models/RoomProfile.cs
          git commit -m 'feat(windows): polish v1.3.1 usability and room operations'
          git push origin HEAD:feat/windows-client-v1
