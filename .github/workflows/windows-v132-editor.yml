name: Windows v1.3.2 editor workflow

on:
  push:
    branches:
      - feat/windows-client-v1
    paths:
      - scripts/apply_windows_v132_editor_workflow.py
      - .github/workflows/windows-v132-editor.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-client-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.3.2 editor workflow polish
        run: python scripts/apply_windows_v132_editor_workflow.py
      - name: Disambiguate WPF keyboard event type
        shell: pwsh
        run: |
          $path = 'desktop/KakaoMacro.Windows/MainWindow.xaml.cs'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $text = $text.Replace('private void Window_PreviewKeyDown(object sender, KeyEventArgs e)', 'private void Window_PreviewKeyDown(object sender, System.Windows.Input.KeyEventArgs e)')
          Set-Content -Path $path -Value $text -Encoding UTF8
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj
      - name: Build release
        run: dotnet build desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release --no-restore -warnaserror
      - name: Publish self-contained x64
        run: dotnet publish desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o desktop/publish/v1.3.2
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/KakaoMacro.Windows/MainWindow.xaml \
                  desktop/KakaoMacro.Windows/MainWindow.xaml.cs
          git commit -m 'feat(windows): auto-save room edits and add keyboard shortcuts'
          git push origin HEAD:feat/windows-client-v1
