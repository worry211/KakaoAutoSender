name: Discord seller v8 editor

on:
  push:
    branches: [feat/discord-seller-console-v8]
    paths:
      - 'scripts/patch_discord_seller_v8.mjs'
      - '.github/workflows/discord-v8-editor.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discord-seller-console-v8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply seller console v8 UX patch
        run: node scripts/patch_discord_seller_v8.mjs
      - name: Format and verify backend
        working-directory: backend
        run: |
          npm ci
          npx prettier --write src/discordV2.ts
          npm run typecheck
          npm run lint
          npm test
          npm audit --audit-level=high
      - name: Commit verified product code
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/discordV2.ts
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'feat(discord): refine seller console v8 mobile operations UX'
          git push origin HEAD:feat/discord-seller-console-v8
