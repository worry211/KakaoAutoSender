name: Backend production deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: '검증만 또는 production 배포 범위'
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy_worker
          - deploy_and_register
      pc_bootstrap:
        description: 'Temporarily allow protected, read-only PC migration bootstrap'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: kakaomacro-backend-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Backend quality gate
        working-directory: backend
        run: npm run typecheck && npm run lint && npm test && npm audit --audit-level=moderate

  deploy:
    needs: verify
    if: github.event.inputs.action != 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PC_BRIDGE_TOKEN: ${{ secrets.PC_BRIDGE_TOKEN }}
      PC_SERVER_MODE: ${{ vars.PC_SERVER_MODE || 'd1' }}
    steps:
      - name: Refuse non-main production deploys
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo 'Production deployment must be dispatched from main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Check Cloudflare deployment credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'Missing CLOUDFLARE_API_TOKEN production secret.' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID production secret.' >&2; exit 1; }
      - name: Refuse outdated main revision
        shell: bash
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Validate PC hosting mode
        shell: bash
        run: |
          case "$PC_SERVER_MODE" in d1|pc) ;; *) echo 'Invalid PC_SERVER_MODE' >&2; exit 1;; esac
          if [ "$PC_SERVER_MODE" = 'pc' ]; then
            test -n "$PC_BRIDGE_TOKEN" || { echo 'Missing owner bridge secret' >&2; exit 1; }
          fi
      - name: Install protected owner bridge secret
        if: env.PC_BRIDGE_TOKEN != ''
        working-directory: backend
        shell: bash
        run: printf '%s' "$PC_BRIDGE_TOKEN" | npx wrangler secret put PC_BRIDGE_TOKEN
      - name: Deploy Worker
        working-directory: backend
        run: npm run deploy -- --tag "${GITHUB_SHA}" --message "GitHub production ${GITHUB_SHA}" --var "PC_SERVER_MODE:${PC_SERVER_MODE}" --var "PC_BOOTSTRAP_ENABLED:${{ inputs.pc_bootstrap && 'true' || 'false' }}"
      - name: Smoke public client config and deployment provenance
        working-directory: backend
        run: node scripts/verify-production.mjs
      - name: Verify deployed revision is still main
        shell: bash
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Check Discord registration credentials
        if: github.event.inputs.action == 'deploy_and_register'
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        shell: bash
        run: |
          test -n "${DISCORD_APPLICATION_ID}" || { echo 'Missing DISCORD_APPLICATION_ID production secret.' >&2; exit 1; }
          test -n "${DISCORD_BOT_TOKEN}" || { echo 'Missing DISCORD_BOT_TOKEN production secret.' >&2; exit 1; }
          test -n "${DISCORD_GUILD_ID}" || { echo 'Missing DISCORD_GUILD_ID production secret.' >&2; exit 1; }
      - name: Register and verify seller Discord commands
        if: github.event.inputs.action == 'deploy_and_register'
        working-directory: backend
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: npm run register
