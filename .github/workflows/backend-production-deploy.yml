name: Backend production deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: '검증만 또는 production 배포 범위'
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy_worker
          - deploy_and_register

permissions:
  contents: read

concurrency:
  group: kakaomacro-backend-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Backend quality gate
        working-directory: backend
        run: npm run typecheck && npm run lint && npm test && npm audit --audit-level=moderate

  deploy:
    needs: verify
    if: github.event.inputs.action != 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Refuse non-main production deploys
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo 'Production deployment must be dispatched from main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Check Cloudflare deployment credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'Missing CLOUDFLARE_API_TOKEN production secret.' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID production secret.' >&2; exit 1; }
      - name: Deploy Worker
        working-directory: backend
        run: npm run deploy -- --tag "${GITHUB_SHA}" --message "GitHub production ${GITHUB_SHA}"
      - name: Smoke public client config and deployment provenance
        shell: bash
        run: |
          node <<'NODE'
          const configUrl = 'https://kakaomacro-license.ei3921163.workers.dev/api/v1/client-config';
          const configResponse = await fetch(configUrl, { headers: { 'Cache-Control': 'no-cache' } });
          if (!configResponse.ok) throw new Error(`client-config HTTP ${configResponse.status}`);
          const config = await configResponse.json();
          if (config.state !== 'CONFIG') throw new Error(`unexpected client-config state: ${config.state}`);
          for (const key of ['maintenance', 'kill_switch', 'min_version', 'latest_version']) {
            if (!(key in config)) throw new Error(`client-config missing ${key}`);
          }

          const deploymentUrl = 'https://kakaomacro-license.ei3921163.workers.dev/api/v1/deployment';
          const deploymentResponse = await fetch(deploymentUrl, { headers: { 'Cache-Control': 'no-cache' } });
          if (!deploymentResponse.ok) throw new Error(`deployment HTTP ${deploymentResponse.status}`);
          const deployment = await deploymentResponse.json();
          if (deployment.state !== 'DEPLOYMENT') throw new Error(`unexpected deployment state: ${deployment.state}`);
          if (deployment.tag !== process.env.GITHUB_SHA) {
            throw new Error(`live revision mismatch: expected ${process.env.GITHUB_SHA}, got ${deployment.tag || '<empty>'}`);
          }
          if (!deployment.deployed_at) throw new Error('deployment metadata missing deployed_at');

          console.log(`Worker smoke PASS · state=${config.state} min=${config.min_version} latest=${config.latest_version}`);
          console.log(`Production provenance PASS · tag=${deployment.tag} deployed_at=${deployment.deployed_at}`);
          NODE
      - name: Check Discord registration credentials
        if: github.event.inputs.action == 'deploy_and_register'
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        shell: bash
        run: |
          test -n "${DISCORD_APPLICATION_ID}" || { echo 'Missing DISCORD_APPLICATION_ID production secret.' >&2; exit 1; }
          test -n "${DISCORD_BOT_TOKEN}" || { echo 'Missing DISCORD_BOT_TOKEN production secret.' >&2; exit 1; }
          test -n "${DISCORD_GUILD_ID}" || { echo 'Missing DISCORD_GUILD_ID production secret.' >&2; exit 1; }
      - name: Register and verify seller Discord commands
        if: github.event.inputs.action == 'deploy_and_register'
        working-directory: backend
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: npm run register
