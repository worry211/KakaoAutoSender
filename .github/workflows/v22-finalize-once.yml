name: v2.2 finalization gate

on:
  push:
    branches:
      - feat/v2-2-final-commercial-polish

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/v2-2-final-commercial-polish

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v2.2 product transforms
        run: |
          python scripts/.tmp-v22-dashboard.py
          python scripts/.tmp-v22-editor.py
          python scripts/.tmp-v22-session.py
          python scripts/.tmp-v22-finalize.py
          rm -f scripts/.tmp-v22-dashboard.py scripts/.tmp-v22-editor.py scripts/.tmp-v22-session.py scripts/.tmp-v22-finalize.py

      - name: Validate backend
        working-directory: backend
        run: npm ci && npm run typecheck && npm run lint && npm test && npm audit --audit-level=moderate

      - name: Validate Android debug
        run: ANDROID_HOME=/usr/local/lib/android/sdk ANDROID_SDK_ROOT=/usr/local/lib/android/sdk gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Validate minified release fixture
        env:
          ANDROID_API_BASE_URL: https://license.example.com
          ANDROID_KEYSTORE_PATH: /tmp/kakaomacro-v22-smoke.jks
          ANDROID_KEYSTORE_PASSWORD: smoke-password
          ANDROID_KEY_ALIAS: smoke
        run: |
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI smoke only"
          gradle --no-daemon :app:validateReleaseConfiguration :app:assembleRelease :app:lintRelease
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Commit validated v2.2 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: finalize v2.2.0 commercial product quality"
          git push origin HEAD:feat/v2-2-final-commercial-polish
