name: Panel OFF Android device checks
on:
  push:
    branches: [feat/android-photo-reply-actions]
    paths: ['app/**', 'third_party/**', 'scripts/panel-device-check.py', '.github/workflows/panel-off-device.yml', 'build.gradle', 'settings.gradle']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile APK and device tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :spake2:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest :spake2:connectedDebugAndroidTest
            python3 scripts/panel-device-check.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-device-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            third_party/spake2/build/reports/androidTests
            panel-device-results.json
