name: Discord seller console v2 quality

on:
  push:
    branches: [feat/discord-seller-console-v2-quality]
    paths:
      - 'scripts/upgrade_discord_seller_console_v2.py'
      - '.github/workflows/discord-seller-console-v2-quality.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discord-seller-console-v2-quality
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply seller console quality pass
        run: python scripts/upgrade_discord_seller_console_v2.py
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Format changed backend files
        working-directory: backend
        run: npx prettier --write src/discordV2.ts test/discord-v2.test.ts
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Test
        working-directory: backend
        run: npm test
      - name: Audit production dependency tree
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified console changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/discordV2.ts backend/test/discord-v2.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat(discord): elevate seller console operations UX"
            git push origin HEAD:feat/discord-seller-console-v2-quality
          fi
