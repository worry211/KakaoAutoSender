name: Android v2.3 delete hardening

on:
  push:
    branches:
      - feat/android-v2-3-bulk-performance-polish
    paths:
      - scripts/apply_android_v23_delete_transaction_hardening.py
      - .github/workflows/android-v23-delete-hardening.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    env:
      ANDROID_API_BASE_URL: https://kakaomacro-license.ei3921163.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-v2-3-bulk-performance-polish
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply transactional delete hardening
        run: python3 scripts/apply_android_v23_delete_transaction_hardening.py
      - name: Test, lint and build
        run: ANDROID_HOME=/usr/local/lib/android/sdk ANDROID_SDK_ROOT=/usr/local/lib/android/sdk gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Commit verified source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/local/kakaoautosender/MainActivityV4.java
          git commit -m 'fix(android): make bulk room deletion persistence-first'
          git push origin HEAD:feat/android-v2-3-bulk-performance-polish
