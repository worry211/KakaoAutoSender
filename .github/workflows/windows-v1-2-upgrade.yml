name: Windows v1.2 upgrade
on:
  push:
    branches: [feat/windows-client-v1]
    paths:
      - '.github/workflows/windows-v1-2-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-client-v1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply v1.2 UX and performance patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          cs_path = Path('desktop/KakaoMacro.Windows/MainWindow.xaml.cs')
          cs = cs_path.read_text(encoding='utf-8')
          cs = replace_once(cs,
              '    private static readonly TimeSpan SchedulerResolution = TimeSpan.FromMilliseconds(500);',
              '    private static readonly TimeSpan SchedulerResolution = TimeSpan.FromSeconds(1);',
              'scheduler resolution')
          cs = replace_once(cs,
              '    private readonly AppSettings _settings;\n',
              '',
              'settings field')
          cs = replace_once(cs,
              '    private CancellationTokenSource? _saveDebounce;\n',
              '    private CancellationTokenSource? _saveDebounce;\n    private CancellationTokenSource? _searchDebounce;\n    private readonly Dictionary<Guid, BulkEditSnapshot> _lastBulkUndo = new();\n',
              'state fields')
          cs = replace_once(cs,
              '    private string _roomSearch = "";\n',
              '    private string _roomSearch = "";\n    private string _roomFilter = "ALL";\n',
              'filter field')
          cs = replace_once(cs,
              '        _settings = _store.Load();\n        _rooms = new ObservableCollection<RoomProfile>(_settings.Rooms);',
              '        var settings = _store.Load();\n        _rooms = new ObservableCollection<RoomProfile>(settings.Rooms);',
              'settings load')

          old_search = '''    private void RoomSearch_TextChanged(object sender, TextChangedEventArgs e)\n    {\n        _roomSearch = RoomSearchBox.Text.Trim();\n        _roomView.Refresh();\n        UpdateDashboard();\n    }\n\n    private bool FilterRoom(object item)\n    {\n        if (item is not RoomProfile room || string.IsNullOrWhiteSpace(_roomSearch)) return true;\n        return room.DisplayName.Contains(_roomSearch, StringComparison.OrdinalIgnoreCase)\n            || (room.Binding?.WindowTitle?.Contains(_roomSearch, StringComparison.OrdinalIgnoreCase) ?? false)\n            || room.LastStatus.Contains(_roomSearch, StringComparison.OrdinalIgnoreCase);\n    }'''
          new_search = '''    private async void RoomSearch_TextChanged(object sender, TextChangedEventArgs e)\n    {\n        _searchDebounce?.Cancel();\n        _searchDebounce?.Dispose();\n        _searchDebounce = new CancellationTokenSource();\n        var token = _searchDebounce.Token;\n        try\n        {\n            await Task.Delay(180, token);\n            if (token.IsCancellationRequested) return;\n            _roomSearch = RoomSearchBox.Text.Trim();\n            _roomView.Refresh();\n            UpdateDashboard();\n        }\n        catch (OperationCanceledException)\n        {\n        }\n    }\n\n    private void RoomFilterBox_SelectionChanged(object sender, SelectionChangedEventArgs e)\n    {\n        if (RoomFilterBox is null) return;\n        _roomFilter = RoomFilterBox.SelectedIndex switch\n        {\n            1 => "RUNNING",\n            2 => "ENABLED",\n            3 => "UNLINKED",\n            4 => "ATTENTION",\n            _ => "ALL",\n        };\n        _roomView.Refresh();\n        UpdateDashboard();\n    }\n\n    private bool FilterRoom(object item)\n    {\n        if (item is not RoomProfile room) return false;\n        var matchesState = _roomFilter switch\n        {\n            "RUNNING" => room.Running,\n            "ENABLED" => room.Enabled,\n            "UNLINKED" => room.Binding is null,\n            "ATTENTION" => room.Enabled && (room.Binding is null || room.FailureStreak > 0\n                || room.LastStatus.Contains("필요", StringComparison.OrdinalIgnoreCase)\n                || room.LastStatus.Contains("실패", StringComparison.OrdinalIgnoreCase)\n                || room.LastStatus.Contains("차단", StringComparison.OrdinalIgnoreCase)\n                || room.LastStatus.Contains("중지", StringComparison.OrdinalIgnoreCase)),\n            _ => true,\n        };\n        if (!matchesState) return false;\n        if (string.IsNullOrWhiteSpace(_roomSearch)) return true;\n        return room.DisplayName.Contains(_roomSearch, StringComparison.OrdinalIgnoreCase)\n            || (room.Binding?.WindowTitle?.Contains(_roomSearch, StringComparison.OrdinalIgnoreCase) ?? false)\n            || room.LastStatus.Contains(_roomSearch, StringComparison.OrdinalIgnoreCase);\n    }'''
          cs = replace_once(cs, old_search, new_search, 'search/filter block')

          cs = replace_once(cs,
              '        foreach (var room in selected)\n        {\n            if (applyMessage) room.Message = message;',
              '        CaptureBulkUndo(selected);\n        foreach (var room in selected)\n        {\n            if (applyMessage) room.Message = message;',
              'bulk undo capture')
          cs = replace_once(cs,
              '        var now = DateTimeOffset.Now;\n        var copied = 0;\n        foreach (var room in selected.Where(r => r.Id != source.Id))',
              '        CaptureBulkUndo(selected.Where(r => r.Id != source.Id).ToList());\n        var now = DateTimeOffset.Now;\n        var copied = 0;\n        foreach (var room in selected.Where(r => r.Id != source.Id))',
              'copy undo capture')
          cs = replace_once(cs,
              '        var selected = SelectedRooms();\n        if (selected.Count == 0) return;\n        foreach (var room in selected)\n        {\n            room.Enabled = enabled;',
              '        var selected = SelectedRooms();\n        if (selected.Count == 0) return;\n        CaptureBulkUndo(selected);\n        foreach (var room in selected)\n        {\n            room.Enabled = enabled;',
              'enable undo capture')

          marker = '    private async void ValidateSelected_Click(object sender, RoutedEventArgs e)\n'
          addition = '''    private async void SendSelectedNow_Click(object sender, RoutedEventArgs e)\n    {\n        var selected = SelectedRooms();\n        if (selected.Count == 0)\n        {\n            MessageBox.Show("1회 전송할 방을 하나 이상 선택하세요.");\n            return;\n        }\n        if (selected.Count > 10)\n        {\n            var confirm = MessageBox.Show(\n                $"선택한 {selected.Count}개 방에 순차적으로 1회 전송할까요?",\n                "KakaoMacro PC",\n                MessageBoxButton.YesNo,\n                MessageBoxImage.Question);\n            if (confirm != MessageBoxResult.Yes) return;\n        }\n        if (selected.Count == 1) SaveEditorToSelected(false);\n        await _license.HeartbeatAsync(_shutdown.Token);\n        if (!_license.CanDispatch)\n        {\n            MessageBox.Show("라이선스 서버 확인 후 전송할 수 있습니다.", "KakaoMacro PC");\n            return;\n        }\n\n        await _schedulerGate.WaitAsync(_shutdown.Token);\n        var sent = 0;\n        try\n        {\n            foreach (var room in selected)\n            {\n                var before = room.LastStatus;\n                await DispatchAsync(room, false, _shutdown.Token);\n                if (!string.Equals(before, room.LastStatus, StringComparison.Ordinal) &&\n                    string.Equals(room.LastStatus, "수동 테스트 전송 성공", StringComparison.Ordinal))\n                    sent++;\n                if (room != selected[^1])\n                    await Task.Delay(InterRoomDelay, _shutdown.Token);\n            }\n        }\n        finally\n        {\n            _schedulerGate.Release();\n        }\n        QueueSaveSettings();\n        RefreshRoomUi();\n        AppendLog($"선택 1회 전송 완료 · 성공 {sent}/{selected.Count}개");\n    }\n\n    private void CaptureBulkUndo(IReadOnlyCollection<RoomProfile> rooms)\n    {\n        _lastBulkUndo.Clear();\n        foreach (var room in rooms)\n        {\n            _lastBulkUndo[room.Id] = new BulkEditSnapshot(\n                room.Message, room.ScheduleKind, room.IntervalMinutes, room.DailyTimes, room.DailyLimit, room.Enabled);\n        }\n        UndoBulkButton.IsEnabled = _lastBulkUndo.Count > 0;\n    }\n\n    private void UndoBulk_Click(object sender, RoutedEventArgs e)\n    {\n        if (_lastBulkUndo.Count == 0) return;\n        var restored = 0;\n        foreach (var room in _rooms)\n        {\n            if (!_lastBulkUndo.TryGetValue(room.Id, out var snapshot)) continue;\n            room.Message = snapshot.Message;\n            room.ScheduleKind = snapshot.ScheduleKind;\n            room.IntervalMinutes = snapshot.IntervalMinutes;\n            room.DailyTimes = snapshot.DailyTimes;\n            room.DailyLimit = snapshot.DailyLimit;\n            room.Enabled = snapshot.Enabled;\n            room.Running = false;\n            room.NextAt = null;\n            room.LastStatus = "일괄 변경 되돌림 · 다시 시작 필요";\n            restored++;\n        }\n        _lastBulkUndo.Clear();\n        UndoBulkButton.IsEnabled = false;\n        QueueSaveSettings();\n        RefreshRoomUi();\n        AppendLog($"마지막 일괄 변경 되돌림 · {restored}개 방");\n    }\n\n'''
          cs = replace_once(cs, marker, addition + marker, 'bulk action methods')

          old_refresh = '''    private void RefreshRoomUi()\n    {\n        if (!Dispatcher.CheckAccess())\n        {\n            Dispatcher.BeginInvoke(RefreshRoomUi);\n            return;\n        }\n        _roomView.Refresh();\n        RoomList.Items.Refresh();\n        UpdateSelectionUi();\n    }'''
          new_refresh = '''    private void RefreshRoomUi()\n    {\n        if (!Dispatcher.CheckAccess())\n        {\n            Dispatcher.BeginInvoke(RefreshRoomUi);\n            return;\n        }\n        _roomView.Refresh();\n        UpdateSelectionUi();\n    }'''
          cs = replace_once(cs, old_refresh, new_refresh, 'refresh dedupe')

          old_save = '''    private void QueueSaveSettings()\n    {\n        if (!Dispatcher.CheckAccess())\n        {\n            Dispatcher.BeginInvoke(QueueSaveSettings);\n            return;\n        }\n        _saveDebounce?.Cancel();\n        _saveDebounce?.Dispose();\n        _saveDebounce = new CancellationTokenSource();\n        var token = _saveDebounce.Token;\n        _ = Task.Run(async () =>\n        {\n            try\n            {\n                await Task.Delay(550, token);\n                if (!token.IsCancellationRequested && !_isShuttingDown)\n                    await Dispatcher.InvokeAsync(SaveSettings);\n            }\n            catch (OperationCanceledException)\n            {\n            }\n        });\n    }\n\n    private void SaveSettings()\n    {\n        _settings.SchemaVersion = 2;\n        _settings.Rooms = _rooms.ToList();\n        _store.Save(_settings);\n    }'''
          new_save = '''    private void QueueSaveSettings()\n    {\n        if (!Dispatcher.CheckAccess())\n        {\n            Dispatcher.BeginInvoke(QueueSaveSettings);\n            return;\n        }\n        _saveDebounce?.Cancel();\n        _saveDebounce?.Dispose();\n        _saveDebounce = new CancellationTokenSource();\n        var token = _saveDebounce.Token;\n        _ = Task.Run(async () =>\n        {\n            try\n            {\n                await Task.Delay(550, token).ConfigureAwait(false);\n                if (token.IsCancellationRequested || _isShuttingDown) return;\n                var snapshot = await Dispatcher.InvokeAsync(BuildSettingsSnapshot);\n                if (!token.IsCancellationRequested && !_isShuttingDown) _store.Save(snapshot);\n            }\n            catch (OperationCanceledException)\n            {\n            }\n        });\n    }\n\n    private AppSettings BuildSettingsSnapshot() => new()\n    {\n        SchemaVersion = 2,\n        Rooms = _rooms.Select(CloneRoomForStorage).ToList(),\n    };\n\n    private static RoomProfile CloneRoomForStorage(RoomProfile room) => new()\n    {\n        Id = room.Id,\n        DisplayName = room.DisplayName,\n        Message = room.Message,\n        ScheduleKind = room.ScheduleKind,\n        IntervalMinutes = room.IntervalMinutes,\n        DailyTimes = room.DailyTimes,\n        DailyLimit = room.DailyLimit,\n        Enabled = room.Enabled,\n        PhotoPath = room.PhotoPath,\n        CountDate = room.CountDate,\n        TodayCount = room.TodayCount,\n        FailureStreak = room.FailureStreak,\n        LastStatus = room.LastStatus,\n        Binding = room.Binding is null ? null : new KakaoBinding\n        {\n            WindowHandle = room.Binding.WindowHandle,\n            FocusHandle = room.Binding.FocusHandle,\n            ProcessId = room.Binding.ProcessId,\n            ProcessStartTicksUtc = room.Binding.ProcessStartTicksUtc,\n            WindowTitle = room.Binding.WindowTitle,\n            TopClass = room.Binding.TopClass,\n            FocusClass = room.Binding.FocusClass,\n            PairedAtUtc = room.Binding.PairedAtUtc,\n        },\n    };\n\n    private void SaveSettings() => _store.Save(BuildSettingsSnapshot());'''
          cs = replace_once(cs, old_save, new_save, 'background save')

          cs = replace_once(cs,
              '            ? $"라이선스 정상 · 실행 {running}개 · 스케줄러 0.5초 해상도 · 방 사이 최소 650ms"',
              '            ? $"라이선스 정상 · 실행 {running}개 · 저부하 1초 스케줄러 · 방 사이 최소 650ms"',
              'dashboard scheduler text')
          cs = replace_once(cs,
              '        _saveDebounce?.Cancel();\n        _dispatchFence.Cancel();',
              '        _saveDebounce?.Cancel();\n        _searchDebounce?.Cancel();\n        _dispatchFence.Cancel();',
              'shutdown cancel')
          cs = replace_once(cs,
              '        _saveDebounce?.Dispose();\n        _shutdown.Dispose();',
              '        _saveDebounce?.Dispose();\n        _searchDebounce?.Dispose();\n        _shutdown.Dispose();',
              'shutdown dispose')
          cs = replace_once(cs,
              '    private static string ShortId(Guid id) => id.ToString("N")[..8];',
              '    private sealed record BulkEditSnapshot(string Message, ScheduleKind ScheduleKind, int IntervalMinutes, string DailyTimes, int DailyLimit, bool Enabled);\n\n    private static string ShortId(Guid id) => id.ToString("N")[..8];',
              'undo record')
          cs_path.write_text(cs, encoding='utf-8')

          xaml_path = Path('desktop/KakaoMacro.Windows/MainWindow.xaml')
          xaml = xaml_path.read_text(encoding='utf-8')
          xaml = replace_once(xaml, 'Text="v1.1 Preview"', 'Text="v1.2 Preview"', 'version badge')
          old_search_ui = '''                    <Grid Grid.Row="1" Margin="0,11,0,8">\n                        <Grid.ColumnDefinitions><ColumnDefinition/><ColumnDefinition Width="Auto"/><ColumnDefinition Width="Auto"/></Grid.ColumnDefinitions>\n                        <TextBox x:Name="RoomSearchBox" ToolTip="방 이름 / 상태 검색" TextChanged="RoomSearch_TextChanged"/>\n                        <Button Grid.Column="1" Content="전체 선택" Click="SelectAllRooms_Click"/>\n                        <Button Grid.Column="2" Content="해제" Click="ClearSelection_Click"/>\n                    </Grid>'''
          new_search_ui = '''                    <Grid Grid.Row="1" Margin="0,11,0,8">\n                        <Grid.ColumnDefinitions><ColumnDefinition/><ColumnDefinition Width="118"/><ColumnDefinition Width="Auto"/><ColumnDefinition Width="Auto"/></Grid.ColumnDefinitions>\n                        <TextBox x:Name="RoomSearchBox" ToolTip="방 이름 / 상태 검색" TextChanged="RoomSearch_TextChanged"/>\n                        <ComboBox x:Name="RoomFilterBox" Grid.Column="1" Margin="6,0,0,0" SelectedIndex="0" SelectionChanged="RoomFilterBox_SelectionChanged" ToolTip="방 상태 필터">\n                            <ComboBoxItem Content="전체"/>\n                            <ComboBoxItem Content="실행 중"/>\n                            <ComboBoxItem Content="사용 설정"/>\n                            <ComboBoxItem Content="연결 필요"/>\n                            <ComboBoxItem Content="확인 필요"/>\n                        </ComboBox>\n                        <Button Grid.Column="2" Content="전체 선택" Click="SelectAllRooms_Click"/>\n                        <Button Grid.Column="3" Content="해제" Click="ClearSelection_Click"/>\n                    </Grid>'''
          xaml = replace_once(xaml, old_search_ui, new_search_ui, 'search/filter UI')
          xaml = replace_once(xaml,
              '                        <Button Content="연결 확인" Click="ValidateSelected_Click"/>\n                        <Button Style="{StaticResource DangerButton}" Content="선택 삭제" Click="RemoveSelected_Click"/>',
              '                        <Button Content="연결 확인" Click="ValidateSelected_Click"/>\n                        <Button Style="{StaticResource PrimaryButton}" Content="선택 1회 전송" Click="SendSelectedNow_Click"/>\n                        <Button Style="{StaticResource DangerButton}" Content="선택 삭제" Click="RemoveSelected_Click"/>',
              'left quick send')
          xaml = replace_once(xaml,
              '                                    <Button Content="첫 선택 방 설정 복사" Click="CopyPrimaryToSelected_Click"/>\n                                    <Button Style="{StaticResource PrimaryButton}" Content="체크한 항목 일괄 적용" Click="ApplyBulk_Click"/>',
              '                                    <Button Content="첫 선택 방 설정 복사" Click="CopyPrimaryToSelected_Click"/>\n                                    <Button x:Name="UndoBulkButton" Content="마지막 일괄 변경 되돌리기" Click="UndoBulk_Click" IsEnabled="False"/>\n                                    <Button Style="{StaticResource PrimaryButton}" Content="체크한 항목 일괄 적용" Click="ApplyBulk_Click"/>',
              'undo button')
          xaml = replace_once(xaml,
              '                                    <Button Content="선택 연결 확인" Click="ValidateSelected_Click"/>',
              '                                    <Button Content="선택 연결 확인" Click="ValidateSelected_Click"/>\n                                    <Button Style="{StaticResource PrimaryButton}" Content="선택 1회 전송" Click="SendSelectedNow_Click"/>',
              'bulk quick send')
          xaml_path.write_text(xaml, encoding='utf-8')

          proj_path = Path('desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj')
          proj = proj_path.read_text(encoding='utf-8')
          proj = replace_once(proj, '<Version>1.1.0-preview.2</Version>', '<Version>1.2.0-preview.1</Version>', 'assembly version')
          proj_path.write_text(proj, encoding='utf-8')
      - name: Verify Release with warnings as errors
        run: dotnet build desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release -warnaserror
      - name: Commit v1.2 upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/KakaoMacro.Windows/MainWindow.xaml desktop/KakaoMacro.Windows/MainWindow.xaml.cs desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj
          git commit -m 'feat(windows): ship v1.2 bulk operations and low-latency UX'
          git push origin HEAD:feat/windows-client-v1