name: Windows client

on:
  push:
    branches: [main, feat/windows-client-v1]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-client.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-client.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore win-x64
        run: dotnet restore desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -r win-x64
      - name: Release build with warnings as errors
        run: dotnet build desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release -r win-x64 --no-restore -warnaserror
      - name: Routing, stop and recovery regression tests
        run: dotnet test desktop/KakaoMacro.Windows.Tests -c Release -warnaserror --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-safety-test-results
          path: desktop/KakaoMacro.Windows.Tests/TestResults/*.trx
      - name: Publish self-contained x64
        run: dotnet publish desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o desktop/artifacts/win-x64
      - name: Prepare sale executable
        id: package
        shell: pwsh
        run: |
          $source = 'desktop/artifacts/win-x64/KakaoMacro.Windows.exe'
          if (-not (Test-Path $source)) { throw "Published executable not found: $source" }

          $fileVersion = (Get-Item $source).VersionInfo.FileVersion
          $parts = $fileVersion -split '\.'
          if ($parts.Count -lt 3) { throw "Unexpected file version: $fileVersion" }
          $version = ($parts[0..2] -join '.')
          $target = "desktop/artifacts/KakaoMacro-PC-v$version.exe"

          Copy-Item $source $target -Force
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "path=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Sale artifact: $target"
          Get-FileHash $target -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: KakaoMacro-PC-v${{ steps.package.outputs.version }}-sale
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 30
