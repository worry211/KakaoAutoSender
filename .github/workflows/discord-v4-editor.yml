name: Discord seller console v4 editor

on:
  push:
    branches: [feat/discord-seller-console-v4-ops-inbox]
    paths:
      - '.github/workflows/discord-v4-editor.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discord-seller-console-v4-ops-inbox
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply seller operations inbox patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          commands = 'backend/src/commands.ts'
          replace_once(
              commands,
              '      sub("stats", "판매 / 라이선스 현황 요약"),\n',
              '      sub("stats", "판매 / 라이선스 현황 요약"),\n      sub("attention", "오늘 처리할 고객 / 라이선스"),\n',
          )

          admin = 'backend/src/admin.ts'
          marker = '''  if (action === "stats") {\n'''
          attention = '''  if (action === "attention") {\n    const expiringUntil = t + 7 * 86400;\n    const unusedBefore = t - 30 * 86400;\n    const inactiveBefore = t - 7 * 86400;\n    const summary = await env.DB.prepare(\n      `SELECT\n   count(*) FILTER (WHERE\n     (status IN ('ACTIVE','SUSPENDED') AND expires_at>? AND expires_at<=?) OR\n     (status='UNUSED' AND created_at<=?) OR\n     (status='ACTIVE' AND (expires_at IS NULL OR expires_at>?) AND (last_seen_at IS NULL OR last_seen_at<?)) OR\n     status='SUSPENDED'\n   ) AS total_attention,\n   coalesce(sum(status IN ('ACTIVE','SUSPENDED') AND expires_at>? AND expires_at<=?),0) AS expiring_7d,\n   coalesce(sum(status='UNUSED' AND created_at<=?),0) AS unused_30d,\n   coalesce(sum(status='ACTIVE' AND (expires_at IS NULL OR expires_at>?) AND (last_seen_at IS NULL OR last_seen_at<?)),0) AS inactive_7d,\n   coalesce(sum(status='SUSPENDED'),0) AS suspended\n   FROM licenses`,\n    )\n      .bind(\n        t,\n        expiringUntil,\n        unusedBefore,\n        t,\n        inactiveBefore,\n        t,\n        expiringUntil,\n        unusedBefore,\n        t,\n        inactiveBefore,\n      )\n      .first<Row>();\n\n    const rows = await env.DB.prepare(\n      `SELECT *,\n        CASE\n          WHEN status IN ('ACTIVE','SUSPENDED') AND expires_at>? AND expires_at<=? THEN 'EXPIRING'\n          WHEN status='UNUSED' AND created_at<=? THEN 'UNUSED_OLD'\n          WHEN status='ACTIVE' AND (expires_at IS NULL OR expires_at>?) AND (last_seen_at IS NULL OR last_seen_at<?) THEN 'INACTIVE'\n          WHEN status='SUSPENDED' THEN 'SUSPENDED'\n          ELSE NULL\n        END AS attention_kind\n       FROM licenses\n       WHERE\n         (status IN ('ACTIVE','SUSPENDED') AND expires_at>? AND expires_at<=?) OR\n         (status='UNUSED' AND created_at<=?) OR\n         (status='ACTIVE' AND (expires_at IS NULL OR expires_at>?) AND (last_seen_at IS NULL OR last_seen_at<?)) OR\n         status='SUSPENDED'\n       ORDER BY\n         CASE\n           WHEN status IN ('ACTIVE','SUSPENDED') AND expires_at>? AND expires_at<=? THEN 1\n           WHEN status='UNUSED' AND created_at<=? THEN 2\n           WHEN status='ACTIVE' AND (expires_at IS NULL OR expires_at>?) AND (last_seen_at IS NULL OR last_seen_at<?) THEN 3\n           ELSE 4\n         END,\n         coalesce(expires_at, 9223372036854775807) ASC,\n         created_at ASC\n       LIMIT 10`,\n    )\n      .bind(\n        t, expiringUntil, unusedBefore, t, inactiveBefore,\n        t, expiringUntil, unusedBefore, t, inactiveBefore,\n        t, expiringUntil, unusedBefore, t, inactiveBefore,\n      )\n      .all<Row>();\n\n    return {\n      kind: "attention",\n      total_attention: Number(summary?.total_attention ?? 0),\n      expiring_7d: Number(summary?.expiring_7d ?? 0),\n      unused_30d: Number(summary?.unused_30d ?? 0),\n      inactive_7d: Number(summary?.inactive_7d ?? 0),\n      suspended: Number(summary?.suspended ?? 0),\n      licenses: rows.results.map((row) => ({\n        ...support(row),\n        attention_kind: row.attention_kind,\n      })),\n    };\n  }\n'''
          replace_once(admin, marker, attention + marker)

          discord = 'backend/src/discordV2.ts'
          replace_once(
              discord,
              '''const durationText = (seconds: any) => {\n''',
              '''const mutationTitle = (command?: Command) => {\n  if (command?.group !== "license") return null;\n  const titles: Record<string, string> = {\n    extend: "기간 연장 완료",\n    suspend: "라이선스 일시 정지 완료",\n    resume: "라이선스 정지 해제 완료",\n    revoke: "라이선스 취소 완료",\n    delete: "라이선스 삭제 / 차단 완료",\n    "reset-device": "기기 초기화 완료",\n    "replace-unused-key": "미사용 키 교체 완료",\n    note: "관리 메모 변경 완료",\n    "customer-memo": "고객 메모 변경 완료",\n  };\n  return titles[command.action] ?? null;\n};\n\nconst recommendedNextAction = (state: any) => {\n  const recommendations: Record<string, string> = {\n    ACTIVE: "기간이 부족하면 **기간 연장**, 기기 변경 문의라면 **기기 초기화**, 일시적으로 막아야 하면 `/license suspend`를 사용하세요.",\n    UNUSED: "구매자에게 KM 키를 전달하세요. 키를 분실했다면 `/license replace-unused-key`, 고객 식별은 **고객 메모**로 보강하세요.",\n    EXPIRED: "계속 사용할 고객이면 **기간 연장** 후 상태를 다시 확인하세요.",\n    SUSPENDED: "정지 사유가 해결됐다면 `/license resume`, 기간이 부족하면 **기간 연장**을 먼저 확인하세요.",\n    REVOKED: "취소된 라이선스입니다. 새 판매가 필요하면 새 라이선스를 발급하세요.",\n    DELETED: "삭제 / 차단된 라이선스입니다. 기존 키를 재사용하지 말고 새 판매는 새 라이선스로 처리하세요.",\n  };\n  return recommendations[String(state)] ?? "현재 상태와 변경 이력을 확인한 뒤 작업하세요.";\n};\n\nconst attentionMeta = (kind: any) => {\n  const map: Record<string, { label: string; action: string }> = {\n    EXPIRING: { label: "⏳ 7일 내 만료", action: "연장 여부를 고객에게 확인하세요." },\n    UNUSED_OLD: { label: "📦 30일+ 미사용", action: "미전달 / 취소 주문인지 확인하고 필요하면 키를 교체하세요." },\n    INACTIVE: { label: "🌙 7일+ 미접속", action: "사용 중단인지 장애인지 고객 상태를 확인하세요." },\n    SUSPENDED: { label: "⏸️ 정지 상태", action: "정지 사유가 해결됐는지 확인하세요." },\n  };\n  return map[String(kind)] ?? { label: "확인 필요", action: "상세 상태를 확인하세요." };\n};\n\nconst durationText = (seconds: any) => {\n''',
          )

          replace_once(
              discord,
              '''            button("서비스 상태", "nav:system:status", 2),\n''',
              '''            button("서비스 상태", "nav:system:status", 2),\n            button("오늘 처리할 일", "nav:attention", 1),\n''',
          )

          generic_list = '''  if (result?.licenses) {\n'''
          attention_render = '''  if (result?.kind === "attention") {\n    const licenses = Array.isArray(result.licenses) ? result.licenses : [];\n    const fields: any[] = licenses.map((license: Row, index: number) => {\n      const attention = attentionMeta(license.attention_kind);\n      return {\n        name: `#${index + 1} · ${attention.label} · ${license.license_id}`,\n        value: [\n          `**고객**  ${oneLine(license.customer_memo, 100)}`,\n          `**상태 / 기간**  ${stateMeta(license.state).label} · ${licenseTerm(license)}`,\n          `**다음 행동**  ${attention.action}`,\n        ].join("\\n"),\n        inline: false,\n      };\n    });\n    if (!fields.length)\n      fields.push({\n        name: "✅ 오늘 처리할 항목 없음",\n        value: "만료 임박, 오래된 미사용 키, 장기 미접속, 정지 상태 중 즉시 확인할 항목이 없습니다.",\n        inline: false,\n      });\n    const detailButtons = licenses\n      .slice(0, 5)\n      .map((license: Row, index: number) =>\n        button(`${index + 1} 상세`, `nav:info:${license.license_id}`, 2),\n      );\n    return response(\n      "",\n      [\n        {\n          title: "🧭 오늘 처리할 일",\n          description: [\n            `확인 대상 라이선스 **${Number(result.total_attention) || 0}개** · 우선순위 상위 **${licenses.length}개** 표시`,\n            `⏳ 7일 내 만료 **${Number(result.expiring_7d) || 0}** · 📦 30일+ 미사용 **${Number(result.unused_30d) || 0}** · 🌙 7일+ 미접속 **${Number(result.inactive_7d) || 0}** · ⏸️ 정지 **${Number(result.suspended) || 0}**`,\n          ].join("\\n"),\n          color: licenses.length ? COLORS.yellow : COLORS.green,\n          fields,\n          footer: footer("운영 인박스 · 같은 라이선스가 여러 조건에 해당할 수 있음"),\n          timestamp: stamp(),\n        },\n      ],\n      [\n        ...(detailButtons.length ? [{ type: 1, components: detailButtons }] : []),\n        {\n          type: 1,\n          components: [\n            button("↻ 새로고침", "nav:attention", 1),\n            button("고객 찾기", "modal:search", 2),\n            button("7일 내 만료", "nav:exp:7:1", 2),\n            button("미사용 키", "nav:list:UNUSED:1", 2),\n            button("판매자 홈", "nav:home", 2),\n          ],\n        },\n      ],\n    );\n  }\n\n'''
          replace_once(discord, generic_list, attention_render + generic_list)

          replace_once(
              discord,
              '''      {\n        name: "📝 관리 메모",\n        value: oneLine(result.admin_memo, 500),\n        inline: false,\n      },\n    ];\n''',
              '''      {\n        name: "📝 관리 메모",\n        value: oneLine(result.admin_memo, 500),\n        inline: false,\n      },\n      {\n        name: "🧭 추천 다음 작업",\n        value: recommendedNextAction(result.state),\n        inline: false,\n      },\n    ];\n''',
          )

          replace_once(
              discord,
              '''    return response(\n      "",\n      [\n        {\n          title: `${meta.label} · 라이선스 상세`,\n          description: `**${result.license_id}**`,\n          color: meta.color,\n          fields,\n          footer: footer("고객지원용 상세 정보"),\n''',
              '''    const completed = mutationTitle(command);\n    return response(\n      "",\n      [\n        {\n          title: completed ? `✅ ${completed}` : `${meta.label} · 라이선스 상세`,\n          description: completed\n            ? `${meta.label} · **${result.license_id}**\\n변경된 상태를 아래에서 바로 확인하세요.`\n            : `**${result.license_id}**`,\n          color: completed ? COLORS.green : meta.color,\n          fields,\n          footer: footer(completed ? "처리 완료 · 최신 상태" : "고객지원용 상세 정보"),\n''',
          )

          replace_once(
              discord,
              '''            button("↻ 새로고침", "nav:stats", 2),\n            button("7일 만료", "nav:exp:7:1", 2),\n            button("판매자 홈", "nav:home", 2),\n''',
              '''            button("↻ 새로고침", "nav:stats", 2),\n            button("오늘 처리할 일", "nav:attention", 1),\n            button("7일 만료", "nav:exp:7:1", 2),\n''',
          )

          replace_once(
              discord,
              '''  if (custom === "nav:stats")\n    return { group: "license", action: "stats", params: {} };\n''',
              '''  if (custom === "nav:stats")\n    return { group: "license", action: "stats", params: {} };\n  if (custom === "nav:attention")\n    return { group: "license", action: "attention", params: {} };\n''',
          )

          replace_once(
              discord,
              '''        command.params["key-or-id"] = info.license_id;\n''',
              '''        command.params["key-or-id"] = info.license_id;\n        command.params.__confirm_state = info.state;\n        command.params.__confirm_customer = String(info.customer_memo ?? "");\n''',
          )

          replace_once(
              discord,
              '''              { name: "대상", value: `**${target}**`, inline: false },\n              {\n                name: "영향",\n''',
              '''              { name: "대상", value: `**${target}**`, inline: false },\n              ...(command.group === "license"\n                ? [\n                    {\n                      name: "현재 상태",\n                      value: stateMeta(command.params.__confirm_state).label,\n                      inline: true,\n                    },\n                    {\n                      name: "고객 확인",\n                      value: oneLine(command.params.__confirm_customer, 180),\n                      inline: true,\n                    },\n                  ]\n                : []),\n              {\n                name: "영향",\n''',
          )

          seller_test = 'backend/test/seller-ux.test.ts'
          replace_once(
              seller_test,
              '''    expect(parseCommand(interaction("system", "help")).action).toBe("help");\n''',
              '''    expect(parseCommand(interaction("system", "help")).action).toBe("help");\n    expect(parseCommand(interaction("license", "attention")).action).toBe(\n      "attention",\n    );\n''',
          )

          discord_test = Path('backend/test/discord-v2.test.ts')
          text = discord_test.read_text()
          text += r'''\n\ndescribe("Discord seller console v4 operations inbox", () => {\n  const activeLicense = {\n    license_id: "LIC-26faf17a-3175-4322-868e-fafa49ba8838",\n    state: "ACTIVE",\n    created_at: 1_791_000_000,\n    activated_at: 1_791_000_100,\n    expires_at: 1_793_592_000,\n    duration_seconds: 30 * 86400,\n    last_seen_at: 1_791_000_200,\n    device_bound: true,\n    device_reset_count: 0,\n    customer_memo: "테스트 고객",\n    admin_memo: "",\n  };\n\n  it("renders an action-first seller attention inbox", () => {\n    const message = renderDiscordPanel(\n      {\n        kind: "attention",\n        total_attention: 3,\n        expiring_7d: 1,\n        unused_30d: 1,\n        inactive_7d: 1,\n        suspended: 0,\n        licenses: [{ ...activeLicense, attention_kind: "EXPIRING" }],\n      },\n      { group: "license", action: "attention", params: {} } as any,\n    );\n    expect(message.embeds[0].title).toContain("오늘 처리할 일");\n    expect(message.embeds[0].description).toContain("확인 대상 라이선스 **3개**");\n    expect(message.embeds[0].fields[0].value).toContain("다음 행동");\n    expect(message.components.flatMap((row: any) => row.components).map((b: any) => b.label)).toContain(\n      "↻ 새로고침",\n    );\n  });\n\n  it("labels mutation results as completed and recommends the next action", () => {\n    const message = renderDiscordPanel(activeLicense, {\n      group: "license",\n      action: "extend",\n      params: { duration: "30d" },\n    } as any);\n    expect(message.embeds[0].title).toContain("기간 연장 완료");\n    expect(message.embeds[0].fields.some((field: any) => field.name.includes("추천 다음 작업"))).toBe(true);\n  });\n});\n'''
          discord_test.write_text(text)
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Format changed backend files
        working-directory: backend
        run: npx prettier --write src/commands.ts src/admin.ts src/discordV2.ts test/seller-ux.test.ts test/discord-v2.test.ts
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Test
        working-directory: backend
        run: npm test
      - name: Audit production dependency tree
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Commit verified product patch and remove editor workflow
        shell: bash
        run: |
          git rm .github/workflows/discord-v4-editor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src backend/test
          git commit -m 'feat(discord): add seller operations inbox and safer actions'
          git push origin HEAD:feat/discord-seller-console-v4-ops-inbox
