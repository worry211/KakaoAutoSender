name: Trigger v2.3.3 commercial release

on:
  push:
    branches:
      - feat/android-v2-3-bulk-performance-polish
    paths:
      - .github/workflows/trigger-v233-commercial.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing commercial release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run commercial-release.yml --repo worry211/KakaoAutoSender --ref feat/android-v2-3-bulk-performance-polish
