name: Format discord once
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prettier --write src/discord.ts
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-discord
          path: backend/src/discord.ts
