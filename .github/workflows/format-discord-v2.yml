name: Format Discord v2
on:
  push:
    branches: [fix/discord-admin-quality-v2]
    paths:
      - 'backend/src/discordV2.ts'
      - 'backend/src/index.ts'
      - 'backend/test/discord-v2.test.ts'
      - '.github/workflows/format-discord-v2.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discord-admin-quality-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Format seller console sources
        run: npx prettier --write src/discordV2.ts src/index.ts test/discord-v2.test.ts
        working-directory: backend
      - name: Commit canonical formatting when needed
        shell: bash
        run: |
          if git diff --quiet -- backend/src/discordV2.ts backend/src/index.ts backend/test/discord-v2.test.ts; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/discordV2.ts backend/src/index.ts backend/test/discord-v2.test.ts
          git commit -m 'style(discord): apply canonical prettier formatting'
          git push origin HEAD:fix/discord-admin-quality-v2
