name: Android v2.3 bulk performance polish

on:
  push:
    branches:
      - feat/android-v2-3-bulk-performance-polish
    paths:
      - scripts/apply_android_v23_bulk_polish.py
      - .github/workflows/android-v23-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    env:
      ANDROID_API_BASE_URL: https://kakaomacro-license.ei3921163.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-v2-3-bulk-performance-polish
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply v2.3 patch
        run: python3 scripts/apply_android_v23_bulk_polish.py
      - name: Test, lint and build debug candidate
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Commit verified source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/local/kakaoautosender/MainActivityV4.java \
                  app/src/main/java/com/local/kakaoautosender/RoomEditorActivity.java \
                  app/src/main/java/com/local/kakaoautosender/MultiRoomStore.java \
                  app/src/main/java/com/local/kakaoautosender/BulkRoomEditActivity.java \
                  app/src/main/AndroidManifest.xml app/build.gradle
          git commit -m 'feat(android): add bulk editing and reduce dashboard/editor jank'
          git push origin HEAD:feat/android-v2-3-bulk-performance-polish
