name: Format Discord seller console v3

on:
  push:
    branches:
      - feat/discord-seller-console-v3
    paths:
      - .github/workflows/format-discord-seller-v3.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discord-seller-console-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply repository formatting
        working-directory: backend
        run: |
          npm ci
          npx prettier --write src/discordSellerUi.ts src/discordV2.ts test/discord-v2.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/discordSellerUi.ts backend/src/discordV2.ts backend/test/discord-v2.test.ts
          git commit -m "style(discord): format seller console v3"
          git push origin HEAD:feat/discord-seller-console-v3
