name: Windows v1.4 sale finalizer

on:
  push:
    branches: [feat/windows-client-v1]
    paths:
      - 'scripts/finalize_windows_v14_sale.py'
      - '.github/workflows/windows-v14-sale-finalizer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-client-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply sale finalizer
        run: python scripts/finalize_windows_v14_sale.py
      - name: Restore win-x64
        run: dotnet restore desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -r win-x64
      - name: Release build with warnings as errors
        run: dotnet build desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release -r win-x64 --no-restore -warnaserror
      - name: Publish self-contained x64
        run: dotnet publish desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o desktop/artifacts/win-x64
      - name: Verify sale executable version
        shell: pwsh
        run: |
          $exe = 'desktop/artifacts/win-x64/KakaoMacro.Windows.exe'
          if (-not (Test-Path $exe)) { throw "published exe missing" }
          $version = (Get-Item $exe).VersionInfo.FileVersion
          if ($version -notlike '1.4.0*') { throw "unexpected version: $version" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
      - name: Commit verified product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/KakaoMacro.Windows/MainWindow.xaml.cs desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj desktop/README.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "feat(windows): finalize v1.4 sale UX and recovery visibility"
            git push origin HEAD:feat/windows-client-v1
          }
