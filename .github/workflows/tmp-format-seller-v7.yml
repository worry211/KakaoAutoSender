name: tmp-format-seller-v7

on:
  push:
    branches:
      - feat/seller-console-v7-sale-polish-main

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip v7 format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seller-console-v7-sale-polish-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Format v7 touched files
        working-directory: backend
        run: npx prettier --write src/commands.ts test/seller-console-v7.test.ts
      - name: Verify backend commercial gate
        working-directory: backend
        run: npm run typecheck && npm run lint && npm test && npm audit --audit-level=moderate
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Commit formatted product files and self-remove
        run: |
          rm -f .github/workflows/tmp-format-seller-v7.yml
          git config user.name 'worry211'
          git config user.email 'bin0000021@gmail.com'
          git add -A
          git commit -m 'fix(discord): normalize seller console v7 sale polish [skip v7 format]'
          git push origin HEAD:feat/seller-console-v7-sale-polish-main
