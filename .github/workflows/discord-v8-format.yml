name: Discord v8 format test

on:
  push:
    branches: [feat/discord-seller-console-v8]
    paths:
      - '.github/workflows/discord-v8-format.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discord-seller-console-v8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: backend
        run: |
          npm ci
          npx prettier --write test/seller-console-v8.test.ts
          npx prettier --check test/seller-console-v8.test.ts
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/test/seller-console-v8.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(discord): format seller console v8 regression test'
          git push origin HEAD:feat/discord-seller-console-v8
