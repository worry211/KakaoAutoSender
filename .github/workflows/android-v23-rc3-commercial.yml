name: Android v2.3 RC3 stable signed

on:
  push:
    branches:
      - feat/android-v2-3-bulk-performance-polish
    paths:
      - .github/workflows/android-v23-rc3-commercial.yml

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      ANDROID_API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PATH: /tmp/kakaomacro-commercial-release.jks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-v2-3-bulk-performance-polish
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Repository secret scan
        run: node scripts/secret-scan.mjs
      - name: Backend commercial gate
        run: npm ci && npm run typecheck && npm run lint && npm test && npm audit --audit-level=moderate
        working-directory: backend
      - name: Decode stable signing key
        shell: bash
        run: |
          for field in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_API_BASE_URL; do
            test -n "${!field}" || { echo "Missing production setting: $field"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Test, lint, validate and build stable-signed RC3
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:validateReleaseConfiguration :app:assembleRelease :app:lintRelease
      - name: Verify release signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: KakaoMacro-Android-v2.3.0-rc3-sale-candidate
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
