name: Format backend deploy gate v2

on:
  push:
    branches:
      - chore/backend-production-deploy-gate-v2
    paths:
      - .github/workflows/format-backend-deploy-gate-v2.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/backend-production-deploy-gate-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Format registration script
        working-directory: backend
        run: |
          npm ci
          npx prettier --write scripts/register.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scripts/register.mjs
          git commit -m "style(backend): format production command registrar"
          git push origin HEAD:chore/backend-production-deploy-gate-v2
