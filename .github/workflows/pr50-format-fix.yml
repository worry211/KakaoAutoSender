name: PR50 platform policy formatter

on:
  push:
    branches:
      - feat/platform-version-policy-v1

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-version-policy-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Refresh lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Format changed backend files
        working-directory: backend
        run: npx prettier --write src/index.ts src/license.ts
      - name: Verify backend
        working-directory: backend
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm audit --audit-level=moderate
      - name: Commit verified normalization
        run: |
          if git diff --quiet -- backend/package-lock.json backend/src/index.ts backend/src/license.ts; then
            echo "No generated changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json backend/src/index.ts backend/src/license.ts
          git commit -m "chore: normalize platform policy and security lockfile"
          git push origin HEAD:feat/platform-version-policy-v1
