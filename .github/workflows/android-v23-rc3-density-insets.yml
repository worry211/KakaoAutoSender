name: Android v2.3 RC3 density and insets

on:
  push:
    branches:
      - feat/android-v2-3-bulk-performance-polish
    paths:
      - scripts/patch_android_v23_rc3_density_insets.py
      - .github/workflows/android-v23-rc3-density-insets.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-v2-3-bulk-performance-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply RC3 density/inset polish
        run: python scripts/patch_android_v23_rc3_density_insets.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit test, lint and debug build
        run: ANDROID_HOME=/usr/local/lib/android/sdk ANDROID_SDK_ROOT=/usr/local/lib/android/sdk gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Validate minified release fixture
        env:
          ANDROID_API_BASE_URL: https://license.example.com
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-smoke.jks
          ANDROID_KEYSTORE_PASSWORD: smoke-password
          ANDROID_KEY_ALIAS: smoke
          ANDROID_KEY_PASSWORD: smoke-password
        run: |
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -alias smoke -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI smoke only"
          gradle --no-daemon :app:validateReleaseConfiguration :app:assembleRelease :app:lintRelease
      - name: Commit verified product source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle app/src/main/java/com/local/kakaoautosender/MainActivityV4.java app/src/main/java/com/local/kakaoautosender/RoomEditorActivity.java
          git commit -m 'feat(android): compact rc3 mobile operations and fix navigation insets'
          git push origin HEAD:feat/android-v2-3-bulk-performance-polish
