name: Windows v1.3 redesigned operations

on:
  push:
    branches:
      - feat/windows-v1-3-operations-resilience
    paths:
      - scripts/apply_windows_v13_on_redesign.py
      - .github/workflows/windows-v13-redesign-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-v1-3-operations-resilience
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply v1.3 resilience on redesigned workspace
        run: python scripts/apply_windows_v13_on_redesign.py
      - name: Restore
        run: dotnet restore desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj
      - name: Build release with warnings as errors
        run: dotnet build desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true
      - name: Publish self-contained win-x64 RC
        run: dotnet publish desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:TreatWarningsAsErrors=true -o desktop/artifacts/win-x64
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj \
                  desktop/KakaoMacro.Windows/MainWindow.xaml \
                  desktop/KakaoMacro.Windows/MainWindow.xaml.cs \
                  desktop/KakaoMacro.Windows/Services/SettingsStore.cs
          git commit -m 'feat(windows): layer v1.3 resilience onto redesigned workspace'
          git push origin HEAD:feat/windows-v1-3-operations-resilience
