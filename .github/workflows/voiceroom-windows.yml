name: VoiceRoom Windows

on:
  pull_request:
    paths:
      - 'desktop/VoiceRoomManager.Windows/**'
      - '.github/workflows/voiceroom-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore desktop/VoiceRoomManager.Windows/VoiceRoomManager.Windows.csproj
      - name: Build
        run: dotnet build desktop/VoiceRoomManager.Windows/VoiceRoomManager.Windows.csproj -c Release --no-restore
      - name: Publish single-file x64
        run: dotnet publish desktop/VoiceRoomManager.Windows/VoiceRoomManager.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/windows
      - name: Hash executable
        shell: pwsh
        run: Get-FileHash out/windows/VoiceRoomManager.Windows.exe -Algorithm SHA256 | Format-List | Out-File out/windows/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceRoomManager-Windows-x64
          path: out/windows/
          if-no-files-found: error
