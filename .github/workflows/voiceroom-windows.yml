name: VoiceRoom Windows
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/package-voiceroom-windows.ps1'
      - '.github/workflows/voiceroom-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voiceroom-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore desktop/VoiceRoomManager.Windows.Tests/VoiceRoomManager.Windows.Tests.csproj
      - name: Build Release
        run: dotnet build desktop/VoiceRoomManager.Windows/VoiceRoomManager.Windows.csproj -c Release --no-restore
      - name: Regression and screenshot fixture tests
        run: dotnet test desktop/VoiceRoomManager.Windows.Tests -c Release --no-restore --logger "trx;LogFileName=windows.trx"
      - name: Publish self-contained EXE, ZIP and SHA-256
        shell: pwsh
        run: ./scripts/package-voiceroom-windows.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/out/windows"
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceRoomManager-Windows-x64
          path: out/windows/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VoiceRoomManager-Windows-test-results
          path: desktop/VoiceRoomManager.Windows.Tests/TestResults/
