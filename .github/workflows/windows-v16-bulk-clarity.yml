name: Windows v1.6 bulk clarity polish

on:
  push:
    branches:
      - feat/windows-v1-6-premium-workspace

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-v1-6-premium-workspace
          fetch-depth: 0
      - name: Make unchecked bulk fields visually inactive
        shell: python
        run: |
          from pathlib import Path
          p = Path('desktop/KakaoMacro.Windows/MainWindow.xaml')
          s = p.read_text(encoding='utf-8')
          pairs = [
            ('<TextBox x:Name="BulkMessageEditor" Height="118"', '<TextBox x:Name="BulkMessageEditor" IsEnabled="{Binding IsChecked, ElementName=ApplyMessageCheck}" Height="118"'),
            ('<StackPanel Grid.Column="2">\n                                                    <CheckBox x:Name="ApplyScheduleCheck"', '<StackPanel Grid.Column="2">\n                                                    <CheckBox x:Name="ApplyScheduleCheck"'),
            ('<ComboBox x:Name="BulkScheduleModeBox" SelectedIndex="0" Margin="0,7,0,0">', '<ComboBox x:Name="BulkScheduleModeBox" IsEnabled="{Binding IsChecked, ElementName=ApplyScheduleCheck}" SelectedIndex="0" Margin="0,7,0,0">'),
            ('<TextBox x:Name="BulkIntervalBox" Text="60" ToolTip="간격 반복일 때 분 단위"/>', '<TextBox x:Name="BulkIntervalBox" IsEnabled="{Binding IsChecked, ElementName=ApplyScheduleCheck}" Text="60" ToolTip="간격 반복일 때 분 단위"/>'),
            ('<TextBox x:Name="BulkTimesBox" Grid.Column="2" Text="09:00"', '<TextBox x:Name="BulkTimesBox" Grid.Column="2" IsEnabled="{Binding IsChecked, ElementName=ApplyScheduleCheck}" Text="09:00"'),
            ('<TextBox x:Name="BulkDailyLimitBox" Text="8"/>', '<TextBox x:Name="BulkDailyLimitBox" IsEnabled="{Binding IsChecked, ElementName=ApplyDailyLimitCheck}" Text="8"/>'),
            ('<CheckBox x:Name="BulkEnabledCheck" Content="자동전송 사용" IsChecked="True"/>', '<CheckBox x:Name="BulkEnabledCheck" IsEnabled="{Binding IsChecked, ElementName=ApplyEnabledCheck}" Content="자동전송 사용" IsChecked="True"/>'),
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit(f'missing expected XAML fragment: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit UX polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/KakaoMacro.Windows/MainWindow.xaml
          git diff --cached --quiet && exit 0
          git commit -m "fix(windows): clarify bulk edit activation states"
          git push origin HEAD:feat/windows-v1-6-premium-workspace
