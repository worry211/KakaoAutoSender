name: Discord seller console v4 editor retry

on:
  push:
    branches: [feat/discord-seller-console-v4-ops-inbox]
    paths:
      - '.github/workflows/discord-v4-editor-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discord-seller-console-v4-ops-inbox
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply corrected seller operations patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/discord-v4-editor.yml').read_text()
          source = source.replace("text += r'''", "text += '''", 1)
          marker = "python3 - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(body), {})
          PY
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Format changed backend files
        working-directory: backend
        run: npx prettier --write src/commands.ts src/admin.ts src/discordV2.ts test/seller-ux.test.ts test/discord-v2.test.ts
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Test
        working-directory: backend
        run: npm test
      - name: Audit
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Commit verified patch
        shell: bash
        run: |
          git rm .github/workflows/discord-v4-editor.yml .github/workflows/discord-v4-editor-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src backend/test
          git commit -m 'feat(discord): add seller operations inbox and safer actions'
          git push origin HEAD:feat/discord-seller-console-v4-ops-inbox
