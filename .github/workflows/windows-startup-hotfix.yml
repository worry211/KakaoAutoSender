name: Windows startup hotfix
on:
  push:
    branches:
      - feat/windows-client-v1
    paths:
      - .github/workflows/windows-startup-hotfix.yml
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-client-v1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply startup hardening
        shell: python
        run: |
          from pathlib import Path
          import base64
          app_xaml = Path('desktop/KakaoMacro.Windows/App.xaml')
          s = app_xaml.read_text(encoding='utf-8')
          s = s.replace('             StartupUri="MainWindow.xaml">', '>')
          app_xaml.write_text(s, encoding='utf-8')
          app_cs_b64 = ''
          crash_b64 = ''
          Path('desktop/KakaoMacro.Windows/App.xaml.cs').write_bytes(base64.b64decode(app_cs_b64))
          Path('desktop/KakaoMacro.Windows/Services/CrashReporter.cs').write_bytes(base64.b64decode(crash_b64))
          main = Path('desktop/KakaoMacro.Windows/MainWindow.xaml.cs')
          s = main.read_text(encoding='utf-8')
          s = s.replace('    private string _roomFilter = "ALL";\n', '    private string _roomFilter = "ALL";\n    private bool _uiReady;\n', 1)
          s = s.replace('        RoomList.ItemsSource = _roomView;\n        RoomFilterBox.SelectedIndex = 0;\n\n        _identity = new InstallIdentity();', '        RoomList.ItemsSource = _roomView;\n\n        _identity = new InstallIdentity();', 1)
          anchor = '        _tray.ExitRequested += () => Dispatcher.BeginInvoke(Close);\n\n        Loaded += async (_, _) => await InitializeAsync();'
          replacement = '        _tray.ExitRequested += () => Dispatcher.BeginInvoke(Close);\n\n        _uiReady = true;\n        RoomFilterBox.SelectedIndex = 0;\n\n        Loaded += async (_, _) => await InitializeAsync();'
          if anchor not in s:
              raise SystemExit('startup anchor missing')
          s = s.replace(anchor, replacement, 1)
          s = s.replace('    private void UpdateDashboard()\n    {\n        if (DashboardText is null || RuntimeStatusText is null) return;', '    private void UpdateDashboard()\n    {\n        if (!_uiReady || DashboardText is null || RuntimeStatusText is null) return;', 1)
          main.write_text(s, encoding='utf-8')
      - name: Verify release
        run: dotnet build desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release -warnaserror
      - name: Publish self-contained x64
        run: dotnet publish desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o desktop/publish-hotfix
      - name: Commit startup hotfix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/KakaoMacro.Windows/App.xaml desktop/KakaoMacro.Windows/App.xaml.cs desktop/KakaoMacro.Windows/MainWindow.xaml.cs desktop/KakaoMacro.Windows/Services/CrashReporter.cs
          git commit -m 'fix(windows): prevent silent startup crash and log fatal errors'
          git push origin HEAD:feat/windows-client-v1
      - uses: actions/upload-artifact@v4
        with:
          name: KakaoMacro-PC-v1.2.1-startup-hotfix
          path: desktop/publish-hotfix/KakaoMacro.Windows.exe
