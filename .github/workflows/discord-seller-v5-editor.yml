name: Discord seller v5 editor

on:
  push:
    branches:
      - feat/discord-seller-console-v5

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Apply seller console v5 patch
        run: node scripts/apply-discord-seller-v5.mjs

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Secret scan
        run: node scripts/secret-scan.mjs

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test -- --run

      - name: Remove temporary editor files
        run: |
          rm scripts/apply-discord-seller-v5.mjs
          rm .github/workflows/discord-seller-v5-editor.yml

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(discord): add state-aware seller operations"
          git push origin HEAD:feat/discord-seller-console-v5
