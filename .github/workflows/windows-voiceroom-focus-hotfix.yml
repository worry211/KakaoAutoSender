name: Windows VoiceRoom focus hotfix
on:
  push:
    branches:
      - feat/windows-client-v1
    paths:
      - .github/workflows/windows-voiceroom-focus-hotfix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-client-v1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Patch cross-thread Kakao input focus handling
        shell: python
        run: |
          from pathlib import Path
          p = Path('desktop/KakaoMacro.Windows/Services/KakaoWindowBinder.cs')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '            var info = new GUITHREADINFO { cbSize = Marshal.SizeOf<GUITHREADINFO>() };\n            if (!GetGUIThreadInfo(threadId, ref info))\n                return FailCapture("카카오톡 입력 포커스를 확인하지 못했습니다.");\n            var focus = info.hwndFocus == IntPtr.Zero ? top : info.hwndFocus;\n            if (GetAncestor(focus, GA_ROOT) != top)\n                return FailCapture("채팅 입력창에 커서를 둔 뒤 다시 연결해 주세요.");',
              '            var info = new GUITHREADINFO { cbSize = Marshal.SizeOf<GUITHREADINFO>() };\n            // idThread=0 asks Windows for the actual foreground GUI thread.\n            // KakaoTalk can move the chat editor onto a different UI thread when overlays such as VoiceRoom are active.\n            if (!GetGUIThreadInfo(0, ref info))\n                return FailCapture("카카오톡 입력 포커스를 확인하지 못했습니다.");\n            var focus = info.hwndFocus == IntPtr.Zero ? top : info.hwndFocus;\n            if (GetAncestor(focus, GA_ROOT) != top)\n                return FailCapture("채팅 입력창에 커서를 둔 뒤 다시 연결해 주세요.");\n            var focusThread = GetWindowThreadProcessId(focus, out var focusPid);\n            if (focusThread == 0 || focusPid != pid)\n                return FailCapture("채팅 입력 대상이 카카오톡 방에 속하는지 확인하지 못했습니다.");',
              1)

          old = '''            var top = new IntPtr(binding!.WindowHandle);
            var focus = new IntPtr(binding.FocusHandle);
            var previous = GetForegroundWindow();
            var targetThread = GetWindowThreadProcessId(top, out _);
            var currentThread = GetCurrentThreadId();
            var attached = false;
            try
            {
                BringWindowToTop(top);
                SetForegroundWindow(top);
                await Task.Delay(90, cancellationToken);
                if (currentThread != targetThread)
                    attached = AttachThreadInput(currentThread, targetThread, true);
                SetFocus(focus);
            }
            finally
            {
                if (attached) AttachThreadInput(currentThread, targetThread, false);
            }

            await Task.Delay(60, cancellationToken);
            if (GetForegroundWindow() != top)
                return new SendResult(false, "대상 카카오톡 창을 안전하게 활성화하지 못했습니다.", SendFailure.FocusFailed);
            var info = new GUITHREADINFO { cbSize = Marshal.SizeOf<GUITHREADINFO>() };
            if (!GetGUIThreadInfo(targetThread, ref info) || info.hwndFocus != focus)
                return new SendResult(false, "저장된 채팅 입력 포커스를 복원하지 못했습니다.", SendFailure.FocusFailed);
'''
          new = '''            var top = new IntPtr(binding!.WindowHandle);
            var focus = new IntPtr(binding.FocusHandle);
            var previous = GetForegroundWindow();
            var targetThread = GetWindowThreadProcessId(top, out var targetPid);
            var focusThread = GetWindowThreadProcessId(focus, out var focusPid);
            if (targetThread == 0 || focusThread == 0 || targetPid != (uint)binding.ProcessId || focusPid != (uint)binding.ProcessId)
                return new SendResult(false, "카카오톡 입력 스레드가 바뀌었습니다. 방을 다시 연결해 주세요.", SendFailure.InvalidBinding);

            var currentThread = GetCurrentThreadId();
            var attachedTarget = false;
            var attachedFocus = false;
            try
            {
                if (currentThread != targetThread)
                    attachedTarget = AttachThreadInput(currentThread, targetThread, true);
                if (currentThread != focusThread && focusThread != targetThread)
                    attachedFocus = AttachThreadInput(currentThread, focusThread, true);

                BringWindowToTop(top);
                SetForegroundWindow(top);
                await Task.Delay(110, cancellationToken);
                SetFocus(focus);
                await Task.Delay(55, cancellationToken);
            }
            finally
            {
                if (attachedFocus) AttachThreadInput(currentThread, focusThread, false);
                if (attachedTarget) AttachThreadInput(currentThread, targetThread, false);
            }

            if (GetForegroundWindow() != top)
                return new SendResult(false, "대상 카카오톡 창을 안전하게 활성화하지 못했습니다.", SendFailure.FocusFailed);
            var info = new GUITHREADINFO { cbSize = Marshal.SizeOf<GUITHREADINFO>() };
            if (!GetGUIThreadInfo(focusThread, ref info) || !FocusMatches(focus, info.hwndFocus, top))
                return new SendResult(false, "채팅 입력창 포커스를 복원하지 못했습니다. 보룸이 켜져 있어도 입력칸을 다시 연결하면 됩니다.", SendFailure.FocusFailed);
'''
          if old not in s:
              raise SystemExit('send focus block not found')
          s = s.replace(old, new, 1)

          helper_anchor = '''    private static uint MillisecondsSinceLastUserInput()
'''
          helper = '''    private static bool FocusMatches(IntPtr expected, IntPtr actual, IntPtr top)
    {
        if (actual == expected) return true;
        if (actual == IntPtr.Zero || GetAncestor(actual, GA_ROOT) != top) return false;
        // Some KakaoTalk builds focus a nested editor child while VoiceRoom is mounted.
        // Accept only the already-paired editor subtree; never any arbitrary child in the room.
        return IsChild(expected, actual) || IsChild(actual, expected);
    }

'''
          if helper_anchor not in s:
              raise SystemExit('helper anchor not found')
          s = s.replace(helper_anchor, helper + helper_anchor, 1)

          dll_anchor = '''    [DllImport("user32.dll")] private static extern bool IsWindowVisible(IntPtr hWnd);
'''
          if dll_anchor not in s:
              raise SystemExit('dll anchor not found')
          s = s.replace(dll_anchor, dll_anchor + '    [DllImport("user32.dll")] private static extern bool IsChild(IntPtr hWndParent, IntPtr hWnd);\n', 1)
          p.write_text(s, encoding='utf-8')

          proj = Path('desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj')
          q = proj.read_text(encoding='utf-8').replace('<Version>1.2.0-preview.1</Version>', '<Version>1.2.2-preview.1</Version>')
          proj.write_text(q, encoding='utf-8')

          xaml = Path('desktop/KakaoMacro.Windows/MainWindow.xaml')
          x = xaml.read_text(encoding='utf-8').replace('v1.2 Preview', 'v1.2.2 Preview')
          xaml.write_text(x, encoding='utf-8')
      - name: Verify release
        run: dotnet build desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release -warnaserror
      - name: Publish self-contained x64
        run: dotnet publish desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o desktop/publish-v122
      - name: Commit VoiceRoom compatibility patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/KakaoMacro.Windows/Services/KakaoWindowBinder.cs desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj desktop/KakaoMacro.Windows/MainWindow.xaml
          git commit -m 'fix(windows): support Kakao VoiceRoom cross-thread chat focus'
          git push origin HEAD:feat/windows-client-v1
      - uses: actions/upload-artifact@v4
        with:
          name: KakaoMacro-PC-v1.2.2-voiceroom-focus
          path: desktop/publish-v122/KakaoMacro.Windows.exe
