name: Windows v1.2 runtime fix
on:
  push:
    branches: [feat/windows-client-v1]
    paths:
      - '.github/workflows/windows-v1-2-runtime-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-client-v1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply runtime hardening
        shell: python
        run: |
          from pathlib import Path

          def one(text, old, new, name):
              if old not in text:
                  raise SystemExit(f'missing anchor: {name}')
              return text.replace(old, new, 1)

          cs_path = Path('desktop/KakaoMacro.Windows/MainWindow.xaml.cs')
          cs = cs_path.read_text(encoding='utf-8')
          cs = one(cs,
              '        RoomList.ItemsSource = _roomView;\n\n        _identity = new InstallIdentity();',
              '        RoomList.ItemsSource = _roomView;\n        RoomFilterBox.SelectedIndex = 0;\n\n        _identity = new InstallIdentity();',
              'safe filter init')
          cs = one(cs,
              '                var before = room.LastStatus;\n                await DispatchAsync(room, false, _shutdown.Token);\n                if (!string.Equals(before, room.LastStatus, StringComparison.Ordinal) &&\n                    string.Equals(room.LastStatus, "수동 테스트 전송 성공", StringComparison.Ordinal))\n                    sent++;',
              '                await DispatchAsync(room, false, _shutdown.Token);\n                if (string.Equals(room.LastStatus, "수동 테스트 전송 성공", StringComparison.Ordinal))\n                    sent++;',
              'batch success accounting')
          cs_path.write_text(cs, encoding='utf-8')

          xaml_path = Path('desktop/KakaoMacro.Windows/MainWindow.xaml')
          xaml = xaml_path.read_text(encoding='utf-8')
          xaml = one(xaml,
              'x:Name="RoomFilterBox" Grid.Column="1" Margin="6,0,0,0" SelectedIndex="0" SelectionChanged="RoomFilterBox_SelectionChanged"',
              'x:Name="RoomFilterBox" Grid.Column="1" Margin="6,0,0,0" SelectionChanged="RoomFilterBox_SelectionChanged"',
              'defer filter selection')
          xaml_path.write_text(xaml, encoding='utf-8')
      - name: Verify Release with warnings as errors
        run: dotnet build desktop/KakaoMacro.Windows/KakaoMacro.Windows.csproj -c Release -warnaserror
      - name: Commit runtime fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/KakaoMacro.Windows/MainWindow.xaml desktop/KakaoMacro.Windows/MainWindow.xaml.cs
          git commit -m 'fix(windows): harden v1.2 startup and batch send status'
          git push origin HEAD:feat/windows-client-v1