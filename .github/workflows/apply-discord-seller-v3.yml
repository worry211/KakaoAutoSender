name: Apply Discord seller console v3

on:
  push:
    branches:
      - feat/discord-seller-console-v3
    paths:
      - .github/workflows/apply-discord-seller-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discord-seller-console-v3
          fetch-depth: 0
      - name: Integrate seller presentation layer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/discordV2.ts')
          text = path.read_text()

          import_line = 'import { polishSellerPanel } from "./discordSellerUi";\n'
          anchor = 'import { friendlyError, needsConfirmation, verifyDiscord } from "./discord";\n'
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)

          old = 'export function renderDiscordPanel(result: any, command?: Command) {'
          new = 'function renderDiscordPanelCore(result: any, command?: Command) {'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('render function anchor not found')

          marker = '/** Text fallback kept for tests/diagnostics; live Discord uses embeds above. */'
          wrapper = '''export function renderDiscordPanel(result: any, command?: Command) {\n  return polishSellerPanel(renderDiscordPanelCore(result, command), result, command);\n}\n\n'''
          if wrapper not in text:
              if marker not in text:
                  raise SystemExit('text fallback marker not found')
              text = text.replace(marker, wrapper + marker, 1)

          nav_anchor = '  if (custom === "nav:stats")\n    return { group: "license", action: "stats", params: {} };'
          nav_home = '  if (custom === "nav:home")\n    return { group: "license", action: "help", params: {} };\n'
          if nav_home not in text:
              if nav_anchor not in text:
                  raise SystemExit('navigation anchor not found')
              text = text.replace(nav_anchor, nav_home + nav_anchor, 1)

          path.write_text(text)
          PY
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/discordV2.ts
          git commit -m "feat(discord): integrate seller console v3 presentation"
          git push origin HEAD:feat/discord-seller-console-v3
